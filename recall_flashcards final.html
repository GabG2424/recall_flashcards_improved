<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e7ecf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)" />
    <title>Recall – Flashcards</title>
    <style>
      :root {
        color-scheme: light dark;
        --desk: #e7ecf3;
        --card: #fefdfa;
        --edge: #cdd5e2;
        --ink: #1b2231;
        --muted: #586174;
        --ruled: #d6e2f2;
        --q-rule: #e2554e;
        --a-rule: #2540d4;
        --accent: #2540d4;
        --on-accent: #ffffff;
        --track: #cdd5e2;
        --known: #1d7a54;
        --on-known: #ffffff;
        --learning: #d9881f;
        --learning-soft: #fde8d0;
        --on-learning-soft: #6f3704;
        --shadow: 0 1px 2px rgb(27 34 49 / 8%), 0 14px 32px -12px rgb(27 34 49 / 22%);
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        --lh: 38px;
        --fs: 25px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --desk: #10141b;
          --card: #1b212c;
          --edge: #2e3747;
          --ink: #eef1f6;
          --muted: #a3adc0;
          --ruled: #263042;
          --q-rule: #ef6f68;
          --a-rule: #8fa0ff;
          --accent: #8fa0ff;
          --on-accent: #0d1330;
          --track: #2e3747;
          --known: #4cc296;
          --on-known: #06150e;
          --learning: #f0a548;
          --learning-soft: #3a2a18;
          --on-learning-soft: #ffcf9b;
          --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 16px 32px -12px rgb(0 0 0 / 60%);
        }
      }

      * { box-sizing: border-box; }

      html { -webkit-text-size-adjust: 100%; }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        background: var(--desk);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.5;
      }

      button { font: inherit; color: inherit; cursor: pointer; }
      button:disabled { cursor: not-allowed; }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      [hidden] { display: none !important; }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .app {
        width: min(100% - 32px, 640px);
        margin: 0 auto;
        padding: max(24px, env(safe-area-inset-top)) 0 max(32px, env(safe-area-inset-bottom));
      }

      /* ---------- Header ---------- */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px 20px;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-family: var(--serif);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .brand svg { width: 30px; height: 30px; flex: none; }

      .decks { display: flex; flex-wrap: wrap; gap: 6px; }

      .deck-btn {
        display: inline-flex;
        align-items: baseline;
        gap: 7px;
        padding: 8px 14px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: transparent;
        font-size: 14px;
        font-weight: 600;
        transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
      }

      .deck-btn .count { font-size: 12px; font-weight: 500; color: var(--muted); }
      .deck-btn:hover { border-color: var(--accent); }
      .deck-btn[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }
      .deck-btn[aria-pressed="true"] .count { color: inherit; opacity: 0.85; }

      /* ---------- Progress ---------- */
      .segments { display: flex; gap: 4px; margin-bottom: 6px; }

      .seg {
        position: relative;
        flex: 1;
        height: 22px;
        padding: 0;
        border: 0;
        background: none;
      }

      .seg::before {
        content: "";
        position: absolute;
        inset: 8px 0;
        border-radius: 3px;
        background: var(--track);
        transition: background 200ms ease;
      }

      .seg[data-state="known"]::before { background: var(--known); }
      .seg[data-state="learning"]::before { background: var(--learning); }
      .seg[aria-current="true"]::before {
        inset: 6px 0;
        box-shadow: 0 0 0 2px var(--desk), 0 0 0 4px var(--accent);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px 16px;
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 14px;
      }

      .meta strong { color: var(--ink); font-weight: 650; }
      .tally { display: flex; gap: 14px; }
      .tally span { display: inline-flex; align-items: center; gap: 6px; }
      .tally span::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dot);
      }
      .tally .known { --dot: var(--known); }
      .tally .learning { --dot: var(--learning); }

      /* ---------- Flashcard ---------- */
      .stack {
        position: relative;
        margin-bottom: 20px;
        perspective: 1400px;
      }

      .stack::before,
      .stack::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid var(--edge);
        border-radius: 14px;
        background: var(--card);
        transition: opacity 200ms ease;
      }

      .stack::before { transform: translateY(12px) scale(0.95); opacity: 0.55; }
      .stack::after { transform: translateY(6px) scale(0.975); opacity: 0.85; }
      .stack[data-left="1"]::before,
      .stack[data-left="0"]::before,
      .stack[data-left="0"]::after { opacity: 0; }

      .stack.enter .flashcard { animation: card-in 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }

      @keyframes card-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }

      .flashcard {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        border-radius: 14px;
        background: none;
        text-align: left;
        -webkit-tap-highlight-color: transparent;
      }

      .flashcard:focus-visible { outline-offset: 5px; }

      .flip {
        display: grid;
        border-radius: 14px;
        transform-style: preserve-3d;
        transition: transform 520ms cubic-bezier(0.3, 0.7, 0.2, 1);
      }

      .flashcard.is-flipped .flip { transform: rotateY(180deg); }

      .face {
        display: flex;
        grid-area: 1 / 1;
        flex-direction: column;
        min-height: 330px;
        border: 1px solid var(--edge);
        border-radius: 14px;
        background: var(--card);
        box-shadow: var(--shadow);
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transition: border-color 150ms ease;
      }

      .face.back { transform: rotateY(180deg); }

      @media (hover: hover) {
        .flashcard:hover .face { border-color: var(--accent); }
      }

      .face-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 14px 22px 10px;
        border-bottom: 2px solid var(--q-rule);
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }

      .face.back .face-head { border-bottom-color: var(--a-rule); }

      .face-head .side { color: var(--ink); }

      .face-body {
        flex: 1;
        min-height: calc(var(--lh) * 5);
        padding: 0 22px;
        background-image: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--ruled) calc(var(--lh) - 1px));
        background-size: 100% var(--lh);
        background-position: 0 0;
      }

      .face-text {
        display: block;
        font-family: var(--serif);
        font-size: var(--fs);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: var(--lh);
        overflow-wrap: anywhere;
      }

      .face-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px 14px;
        color: var(--muted);
        font-size: 14px;
      }

      .face-foot svg { width: 16px; height: 16px; flex: none; }

      /* ---------- Rating + navigation ---------- */
      .rate {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .rate-btn {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 650;
        transition: transform 120ms ease, opacity 150ms ease, filter 150ms ease;
      }

      .rate-btn svg { width: 18px; height: 18px; flex: none; }
      .rate-btn:not(:disabled):active { transform: scale(0.98); }
      .rate-btn:disabled { opacity: 0.45; }
      .rate-btn.learning {
        border-color: var(--learning);
        background: var(--learning-soft);
        color: var(--on-learning-soft);
      }
      .rate-btn.known { background: var(--known); color: var(--on-known); }
      @media (hover: hover) {
        .rate-btn:not(:disabled):hover { filter: brightness(0.94); }
      }

      .nav {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        margin-top: 14px;
      }

      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
      }

      .nav-btn svg { width: 16px; height: 16px; flex: none; }
      .nav-btn:last-child { justify-self: end; }
      .nav-btn:disabled { opacity: 0.4; }
      .nav-btn:not(:disabled):hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
      .nav-btn.shuffle { color: var(--accent); }

      .keys {
        display: none;
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      @media (hover: hover) and (pointer: fine) {
        .keys { display: block; }
      }

      kbd {
        display: inline-block;
        min-width: 22px;
        padding: 1px 6px;
        border: 1px solid var(--edge);
        border-bottom-width: 2px;
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        font: 600 12px/1.5 var(--sans);
        text-align: center;
      }

      /* ---------- Results ---------- */
      .results {
        padding: 28px 24px 26px;
        border: 1px solid var(--edge);
        border-radius: 14px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .results:focus, .results h2:focus { outline: none; }

      .results h2 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(30px, 7vw, 40px);
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .results-copy { margin: 8px 0 0; color: var(--muted); }

      .missed { margin: 22px 0 0; padding: 0; list-style: none; }
      .missed-title { margin: 22px 0 8px; font-size: 14px; font-weight: 650; }
      .missed li {
        padding: 10px 0 10px 14px;
        border-left: 3px solid var(--learning);
        font-family: var(--serif);
        font-size: 18px;
        line-height: 1.4;
      }
      .missed li + li { margin-top: 6px; }

      .results-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }

      .btn {
        min-height: 48px;
        padding: 0 20px;
        border: 1px solid var(--edge);
        border-radius: 12px;
        background: transparent;
        font-size: 16px;
        font-weight: 650;
        transition: filter 150ms ease, border-color 150ms ease;
      }

      .btn.primary { border-color: transparent; background: var(--accent); color: var(--on-accent); }
      @media (hover: hover) {
        .btn:hover { border-color: var(--accent); }
        .btn.primary:hover { filter: brightness(1.08); }
      }

      /* ---------- Small screens ---------- */
      @media (max-width: 560px) {
        :root { --lh: 34px; --fs: 22px; }
        .topbar { margin-bottom: 22px; }
        .face { min-height: 300px; }
        .face-head, .face-foot, .face-body { padding-left: 18px; padding-right: 18px; }
        .btn { flex: 1 1 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ---------- Refreshed modern study theme ---------- */
      :root {
        color-scheme: light dark;
        --desk: #f3f4fb;
        --card: #ffffff;
        --edge: #e0e3f0;
        --ink: #20233d;
        --muted: #727791;
        --ruled: #edf0fa;
        --q-rule: #8b5cf6;
        --a-rule: #06b6d4;
        --accent: #6d4aff;
        --on-accent: #ffffff;
        --track: #e3e5f1;
        --known: #159b78;
        --on-known: #ffffff;
        --learning: #f0a43a;
        --learning-soft: #fff2d9;
        --on-learning-soft: #80520b;
        --shadow: 0 2px 5px rgb(40 35 90 / 4%), 0 18px 45px -20px rgb(66 53 130 / 28%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --desk: #111322;
          --card: #1b1e31;
          --edge: #30344e;
          --ink: #f2f2ff;
          --muted: #a3a8c2;
          --ruled: #282c43;
          --q-rule: #a78bfa;
          --a-rule: #22d3ee;
          --accent: #a78bfa;
          --on-accent: #19132d;
          --track: #30344e;
          --known: #34d399;
          --on-known: #09291e;
          --learning: #fbbf24;
          --learning-soft: #3c301b;
          --on-learning-soft: #ffe1a0;
          --shadow: 0 2px 5px rgb(0 0 0 / 18%), 0 22px 48px -22px rgb(0 0 0 / 70%);
        }
      }

      body {
        background:
          radial-gradient(ellipse at 12% 0%, rgb(139 92 246 / 10%), transparent 34rem),
          radial-gradient(ellipse at 100% 20%, rgb(6 182 212 / 8%), transparent 30rem),
          var(--desk);
        transition: background-color 180ms ease, color 180ms ease;
      }

      .app { width: min(100% - 36px, 720px); padding-top: max(30px, env(safe-area-inset-top)); }

      .topbar { margin-bottom: 32px; }
      .brand {
        font-family: var(--sans);
        font-size: 29px;
        font-weight: 800;
        letter-spacing: -0.055em;
      }
      .brand svg { filter: drop-shadow(0 4px 7px rgb(109 74 255 / 15%)); }

      .decks { gap: 8px; }
      .deck-btn {
        padding: 9px 14px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--card) 76%, transparent);
        box-shadow: 0 2px 5px rgb(30 35 70 / 3%);
      }
      .deck-btn[aria-pressed="true"] {
        box-shadow: 0 7px 18px -8px color-mix(in srgb, var(--accent) 70%, transparent);
      }

      .segments { gap: 5px; margin-bottom: 9px; }
      .seg { height: 20px; }
      .seg::before { inset: 7px 0; border-radius: 99px; }
      .seg[aria-current="true"]::before { border-radius: 99px; }

      .meta { margin-bottom: 18px; font-size: 13px; }
      .meta strong { font-size: 14px; }
      .tally { gap: 12px; }

      .stack { margin-bottom: 22px; }
      .stack::before, .stack::after { border-radius: 22px; }
      .stack::before { transform: translateY(13px) scale(.94); }
      .stack::after { transform: translateY(7px) scale(.975); }
      .flashcard, .flip, .face { border-radius: 22px; }
      .face {
        min-height: 350px;
        border-color: color-mix(in srgb, var(--edge) 80%, transparent);
        box-shadow: var(--shadow);
      }
      .face-head {
        padding: 17px 25px 13px;
        border-bottom-width: 3px;
        font-size: 12px;
        letter-spacing: .09em;
        text-transform: uppercase;
      }
      .face-body {
        padding: 8px 25px 0;
        background-image: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--ruled) calc(var(--lh) - 1px));
      }
      .face-text {
        font-weight: 650;
        letter-spacing: -.025em;
      }
      .face-foot {
        padding: 14px 25px 18px;
        font-size: 13px;
      }

      .rate { gap: 14px; }
      .rate-btn {
        min-height: 56px;
        border-radius: 15px;
        box-shadow: 0 5px 12px -8px rgb(25 30 60 / 35%);
      }
      .rate-btn.learning { border-color: color-mix(in srgb, var(--learning) 45%, var(--edge)); }
      .rate-btn.known { box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--known) 80%, transparent); }

      .nav { margin-top: 18px; }
      .nav-btn { padding: 11px 14px; border-radius: 12px; }
      .nav-btn.shuffle { background: color-mix(in srgb, var(--accent) 9%, transparent); }

      .results {
        padding: 32px 28px;
        border-radius: 22px;
        box-shadow: var(--shadow);
      }
      .results h2 { font-family: var(--sans); font-weight: 800; letter-spacing: -.045em; }
      .missed li { border-left-width: 4px; padding-left: 16px; }
      .btn { border-radius: 14px; }
      .btn.primary { box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--accent) 85%, transparent); }

      @media (max-width: 560px) {
        .app { width: min(100% - 24px, 720px); }
        .topbar { margin-bottom: 24px; }
        .brand { font-size: 26px; }
        .decks { width: 100%; }
        .deck-btn { flex: 1 1 auto; justify-content: center; }
        .face { min-height: 310px; }
        .face-head, .face-foot { padding-left: 19px; padding-right: 19px; }
        .face-body { padding-left: 19px; padding-right: 19px; }
        .results { padding: 25px 20px; }
      }

    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true" fill="none">
            <rect x="6" y="3" width="22" height="16" rx="3.5" fill="currentColor" opacity="0.25" transform="rotate(8 17 11)" />
            <rect x="3" y="9" width="23" height="17" rx="3.5" fill="var(--card)" stroke="currentColor" stroke-width="2" />
            <path d="M3 14.5h23" stroke="var(--q-rule)" stroke-width="2" />
            <path d="M8 19.5h9M8 23h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.5" />
          </svg>
          Recall
        </h1>
        <div class="decks" id="decks" role="group" aria-label="Choose a deck"></div>
      </header>

      <section id="study" aria-label="Flashcard study session">
        <div class="segments" id="segments" role="group" aria-label="Cards in this session"></div>
        <p class="meta">
          <strong id="session-label">Everyday science</strong>
          <span class="tally" aria-live="off">
            <span class="known" id="tally-known">0 known</span>
            <span class="learning" id="tally-learning">0 still learning</span>
          </span>
        </p>

        <div class="stack" id="stack" data-left="2">
          <button class="flashcard" id="flashcard" type="button">
            <span class="flip">
              <span class="face front" id="face-front">
                <span class="face-head"><span class="side">Question</span><span id="count-front"></span></span>
                <span class="face-body"><span class="face-text" id="text-front"></span></span>
                <span class="face-foot">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 0 1 9.4-3.9L13.5 5.7M13.5 2.5v3.2h-3.2M13.5 8a5.5 5.5 0 0 1-9.4 3.9L2.5 10.3M2.5 13.5v-3.2h3.2" /></svg>
                  Think of your answer, then flip
                </span>
              </span>
              <span class="face back" id="face-back">
                <span class="face-head"><span class="side">Answer</span><span id="count-back"></span></span>
                <span class="face-body"><span class="face-text" id="text-back"></span></span>
                <span class="face-foot">How well did you know it?</span>
              </span>
            </span>
          </button>
        </div>

        <div class="rate" id="rate">
          <button class="rate-btn learning" id="learning-button" type="button" disabled>
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a6 6 0 0 1 10.3-4.2L15 6.5M15 3v3.5h-3.5M15 9a6 6 0 0 1-10.3 4.2L3 11.5M3 15v-3.5h3.5" /></svg>
            Still learning
          </button>
          <button class="rate-btn known" id="known-button" type="button" disabled>
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 9.5 3.5 3.5 7.5-8" /></svg>
            Got it
          </button>
        </div>

        <nav class="nav" aria-label="Card navigation">
          <button class="nav-btn" id="previous-button" type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3m4-4.5L3 8l4 4.5" /></svg>
            Previous
          </button>
          <button class="nav-btn shuffle" id="shuffle-button" type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5h2.2c3.3 0 3.3 7 6.6 7H14M2 11.5h2.2c1 0 1.6-.6 2.2-1.4M10.8 4.5H14M12 2.5l2 2-2 2M12 9.5l2 2-2 2" /></svg>
            Shuffle
          </button>
          <button class="nav-btn" id="next-button" type="button">
            Next
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 3.5 13 8l-4 4.5" /></svg>
          </button>
        </nav>

        <p class="keys"><kbd>Space</kbd> flip &nbsp; <kbd>←</kbd> <kbd>→</kbd> move &nbsp; <kbd>1</kbd> still learning &nbsp; <kbd>2</kbd> got it</p>
      </section>

      <section class="results" id="results" aria-labelledby="results-title" hidden>
        <h2 id="results-title" tabindex="-1"></h2>
        <p class="results-copy" id="results-copy"></p>
        <div id="missed-wrap" hidden>
          <p class="missed-title">To review</p>
          <ul class="missed" id="missed"></ul>
        </div>
        <div class="results-actions">
          <button class="btn primary" id="review-button" type="button" hidden></button>
          <button class="btn" id="restart-button" type="button">Study the full deck again</button>
        </div>
      </section>

      <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      (() => {
        const decks = {
          science: {
            name: "Everyday science",
            cards: [
              { question: "What is the closest star to Earth?", answer: "The Sun. It is about 150 million kilometers (93 million miles) away." },
              { question: "What gas do plants absorb from the atmosphere?", answer: "Carbon dioxide. Plants use it, along with water and sunlight, during photosynthesis." },
              { question: "What is the chemical symbol for water?", answer: "H₂O: each water molecule has two hydrogen atoms and one oxygen atom." },
              { question: "Which planet is known as the Red Planet?", answer: "Mars. Iron-rich dust on its surface gives it a reddish color." },
              { question: "What force keeps planets in orbit around the Sun?", answer: "Gravity. The Sun's gravitational pull keeps the planets moving in their orbits." },
              { question: "At what temperature does water boil at sea level?", answer: "100°C, or 212°F, at standard atmospheric pressure." },
              { question: "What is the hardest naturally occurring substance?", answer: "Diamond. Its carbon atoms are bonded in a very strong crystal structure." },
              { question: "Which part of a cell contains most of its genetic material?", answer: "The nucleus. It stores most of a eukaryotic cell's DNA." },
            ],
          },
          geography: {
            name: "World geography",
            cards: [
              { question: "What is the largest ocean on Earth?", answer: "The Pacific Ocean, covering more area than all of Earth's land combined." },
              { question: "What is the capital of Japan?", answer: "Tokyo, on the island of Honshu." },
              { question: "Which continent has the most countries?", answer: "Africa, with 54 internationally recognized sovereign states." },
              { question: "What is the world's longest river commonly recognized as?", answer: "The Nile, flowing north through northeastern Africa for roughly 6,650 kilometers." },
              { question: "Mount Everest lies on the border of which two countries?", answer: "Nepal and China (the Tibet Autonomous Region)." },
              { question: "What is the smallest country in the world by area?", answer: "Vatican City, an independent city-state enclosed within Rome, Italy." },
              { question: "Which desert is the largest hot desert on Earth?", answer: "The Sahara, stretching across much of North Africa." },
              { question: "What is the capital of Canada?", answer: "Ottawa, in the province of Ontario." },
            ],
          },
          web: {
            name: "Web basics",
            cards: [
              { question: "What does HTML stand for?", answer: "HyperText Markup Language. It gives web pages their structure and content." },
              { question: "What is CSS used for?", answer: "Cascading Style Sheets describe how web content looks, including layout, colors, and typography." },
              { question: "What does JavaScript add to a web page?", answer: "Interactivity and behavior, such as responding to clicks or updating content." },
              { question: "What does the acronym URL mean?", answer: "Uniform Resource Locator, the address used to locate a resource on the web." },
              { question: "What does HTTPS help provide?", answer: "An encrypted connection between your browser and a website, using TLS." },
              { question: "What is a browser?", answer: "An app that requests, interprets, and displays web pages, such as Firefox, Safari, or Chrome." },
              { question: "What is responsive web design?", answer: "An approach where a page adapts its layout to different screen sizes and devices." },
              { question: "What does a hyperlink do?", answer: "It connects one resource to another, usually letting you navigate when you click or tap it." },
            ],
          },
        };

        const $ = (selector) => document.querySelector(selector);
        const els = {
          decks: $("#decks"),
          study: $("#study"),
          results: $("#results"),
          segments: $("#segments"),
          sessionLabel: $("#session-label"),
          tallyKnown: $("#tally-known"),
          tallyLearning: $("#tally-learning"),
          stack: $("#stack"),
          flashcard: $("#flashcard"),
          flip: $(".flip"),
          faceFront: $("#face-front"),
          faceBack: $("#face-back"),
          textFront: $("#text-front"),
          textBack: $("#text-back"),
          countFront: $("#count-front"),
          countBack: $("#count-back"),
          learningButton: $("#learning-button"),
          knownButton: $("#known-button"),
          previousButton: $("#previous-button"),
          nextButton: $("#next-button"),
          shuffleButton: $("#shuffle-button"),
          resultsTitle: $("#results-title"),
          resultsCopy: $("#results-copy"),
          missedWrap: $("#missed-wrap"),
          missed: $("#missed"),
          reviewButton: $("#review-button"),
          restartButton: $("#restart-button"),
          status: $("#status"),
        };

        const state = {
          deckKey: "science",
          pool: [],        // the list this session was built from (used by Shuffle)
          cards: [],
          index: 0,
          flipped: false,
          finished: false,
          reviewing: false,
          ratings: new Map(), // card -> "known" | "learning"
        };

        const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;

        function shuffled(items) {
          const copy = [...items];
          for (let i = copy.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
          return copy;
        }

        function announce(message) {
          els.status.textContent = "";
          // Re-set on the next frame so repeated messages are announced again.
          requestAnimationFrame(() => { els.status.textContent = message; });
        }

        /* ----- Setup ----- */
        function buildDeckButtons() {
          Object.entries(decks).forEach(([key, deck]) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "deck-btn";
            button.dataset.deck = key;
            button.innerHTML = `${deck.name} <span class="count">${deck.cards.length}</span>`;
            button.addEventListener("click", () => {
              if (key === state.deckKey && !state.finished && !state.reviewing) return;
              beginSession({ deck: key });
            });
            els.decks.append(button);
          });
        }

        function buildSegments() {
          els.segments.replaceChildren();
          state.cards.forEach((_, i) => {
            const seg = document.createElement("button");
            seg.type = "button";
            seg.className = "seg";
            seg.tabIndex = -1; // keyboard users have Previous / Next and the arrow keys
            seg.addEventListener("click", () => {
              if (state.finished) return;
              goTo(i);
            });
            els.segments.append(seg);
          });
        }

        function beginSession({ deck = state.deckKey, list, shuffle = false, reviewing = false, focus = false } = {}) {
          state.deckKey = deck;
          state.pool = list ?? decks[deck].cards;
          state.cards = shuffle ? shuffled(state.pool) : [...state.pool];
          state.index = 0;
          state.flipped = false;
          state.finished = false;
          state.reviewing = reviewing;
          state.ratings = new Map();
          els.study.hidden = false;
          els.results.hidden = true;
          buildSegments();
          render({ changed: true });
          if (focus) els.flashcard.focus();
        }

        /* ----- Rendering ----- */
        function render({ changed = false } = {}) {
          const { cards, index, flipped, ratings } = state;
          const card = cards[index];
          const total = cards.length;

          els.textFront.textContent = card.question;
          els.textBack.textContent = card.answer;
          els.countFront.textContent = `${index + 1} of ${total}`;
          els.countBack.textContent = `${index + 1} of ${total}`;

          els.flashcard.classList.toggle("is-flipped", flipped);
          els.faceFront.setAttribute("aria-hidden", String(flipped));
          els.faceBack.setAttribute("aria-hidden", String(!flipped));
          els.flashcard.setAttribute(
            "aria-label",
            flipped
              ? `Answer: ${card.answer}. Press to show the question again.`
              : `Question: ${card.question}. Press to reveal the answer.`
          );

          // Switching cards while flipped must not animate, or the next answer flashes by.
          if (changed) {
            els.flip.style.transition = "none";
            void els.flip.offsetWidth;
            els.flip.style.transition = "";
            els.stack.classList.remove("enter");
            void els.stack.offsetWidth;
            els.stack.classList.add("enter");
          }

          els.stack.dataset.left = String(Math.min(2, total - 1 - index));
          els.learningButton.disabled = !flipped;
          els.knownButton.disabled = !flipped;
          els.previousButton.disabled = index === 0;
          els.nextButton.disabled = index === total - 1;

          let knownCount = 0;
          let learningCount = 0;
          [...els.segments.children].forEach((seg, i) => {
            const rating = ratings.get(cards[i]);
            if (rating === "known") knownCount += 1;
            if (rating === "learning") learningCount += 1;
            if (rating) seg.dataset.state = rating; else delete seg.dataset.state;
            seg.setAttribute("aria-label", `Card ${i + 1}${rating ? `, ${rating === "known" ? "known" : "still learning"}` : ""}`);
            if (i === index) seg.setAttribute("aria-current", "true"); else seg.removeAttribute("aria-current");
          });

          els.sessionLabel.textContent = state.reviewing ? "Reviewing missed cards" : decks[state.deckKey].name;
          els.tallyKnown.textContent = `${knownCount} known`;
          els.tallyLearning.textContent = `${learningCount} still learning`;

          els.decks.querySelectorAll(".deck-btn").forEach((button) => {
            button.setAttribute("aria-pressed", String(button.dataset.deck === state.deckKey));
          });

          // If the focused control just became disabled, hand focus to the card.
          const active = document.activeElement;
          if (active && active.disabled) els.flashcard.focus();
        }

        /* ----- Actions ----- */
        function flip() {
          if (state.finished) return;
          state.flipped = !state.flipped;
          render();
          announce(state.flipped ? "Answer shown" : "Question shown");
        }

        function goTo(i) {
          if (state.finished || i < 0 || i >= state.cards.length) return;
          state.index = i;
          state.flipped = false;
          render({ changed: true });
          announce(`Card ${i + 1} of ${state.cards.length}`);
        }

        function move(amount) {
          if (state.finished) {
            if (amount < 0) {
              // Back from the results to the last card.
              state.finished = false;
              els.study.hidden = false;
              els.results.hidden = true;
              state.index = state.cards.length - 1;
              state.flipped = false;
              render({ changed: true });
              els.flashcard.focus();
            }
            return;
          }
          goTo(state.index + amount);
        }

        function nextUnrated(from) {
          const { cards, ratings } = state;
          for (let step = 1; step <= cards.length; step += 1) {
            const i = (from + step) % cards.length;
            if (!ratings.has(cards[i])) return i;
          }
          return -1;
        }

        function rate(value) {
          if (state.finished || !state.flipped) return;
          state.ratings.set(state.cards[state.index], value);
          const next = nextUnrated(state.index);
          if (next === -1) {
            finish();
            return;
          }
          goTo(next);
          els.flashcard.focus();
        }

        function finish() {
          state.finished = true;
          const total = state.cards.length;
          const missed = state.cards.filter((card) => state.ratings.get(card) !== "known");
          const knownCount = total - missed.length;

          els.study.hidden = true;
          els.results.hidden = false;

          if (missed.length === 0) {
            els.resultsTitle.textContent = `You knew all ${total} cards`;
            els.resultsCopy.textContent = state.reviewing
              ? "Every missed card is now covered."
              : "Nothing left to review in this deck. Shuffle it later to keep it fresh.";
          } else {
            els.resultsTitle.textContent = `${knownCount} of ${total} cards known`;
            els.resultsCopy.textContent = `${plural(missed.length, "card")} to go over again while they're fresh.`;
          }

          els.missed.replaceChildren(
            ...missed.map((card) => {
              const li = document.createElement("li");
              li.textContent = card.question;
              return li;
            })
          );
          els.missedWrap.hidden = missed.length === 0;
          els.reviewButton.hidden = missed.length === 0;
          els.reviewButton.textContent = `Review ${plural(missed.length, "missed card")}`;
          els.reviewButton.onclick = () => beginSession({ list: missed, reviewing: true, focus: true });

          els.resultsTitle.focus();
        }

        /* ----- Events ----- */
        els.flashcard.addEventListener("click", flip);
        els.learningButton.addEventListener("click", () => rate("learning"));
        els.knownButton.addEventListener("click", () => rate("known"));
        els.previousButton.addEventListener("click", () => move(-1));
        els.nextButton.addEventListener("click", () => move(1));
        els.shuffleButton.addEventListener("click", () => beginSession({ list: state.pool, reviewing: state.reviewing, shuffle: true, focus: true }));
        els.restartButton.addEventListener("click", () => beginSession({ focus: true }));

        document.addEventListener("keydown", (event) => {
          if (event.altKey || event.ctrlKey || event.metaKey) return;
          const target = event.target;
          if (target instanceof HTMLSelectElement || target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement) return;

          if (event.key === "ArrowLeft") {
            event.preventDefault();
            move(-1);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            move(1);
          } else if (event.key === "1") {
            rate("learning");
          } else if (event.key === "2") {
            rate("known");
          } else if (event.key === " ") {
            // Buttons (including the card itself) handle Space natively.
            if (target instanceof HTMLElement && target.closest("button")) return;
            event.preventDefault();
            flip();
          }
        });

        buildDeckButtons();
        beginSession();
      })();
    </script>
  </body>
</html>
